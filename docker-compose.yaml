services:
  guacd:
    image: guacamole/guacd:1.5.5
    platform: linux/amd64
    container_name: cloudlab-guacd
    restart: no

  cloudlabmanager:
    build:
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    platform: linux/amd64

    ports:
      - 8000:8000
      - 8765:8765

    environment:
      HOST_HOSTNAME: "jakesmac"
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      VAULT_PASSWORD: ${VAULT_PASSWORD:-}
      LOCAL_MODE: ${LOCAL_MODE:-}
      MCP_SERVICE_ACCOUNT_PASSWORD: ${MCP_SERVICE_ACCOUNT_PASSWORD:-}
      SENDAMATIC_API_KEY: ${SENDAMATIC_API_KEY:-}
      SENDAMATIC_SENDER_EMAIL: ${SENDAMATIC_SENDER_EMAIL:-}
      SENDAMATIC_SENDER_NAME: ${SENDAMATIC_SENDER_NAME:-CloudLab Manager}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-CloudLab Manager}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GUACD_HOST: ${GUACD_HOST:-guacd}
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-member}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}

    container_name: cloud-lab-manager

    depends_on:
      - guacd

    #restart: unless-stopped
    restart: no

    volumes:
      - ./data:/data
      - ../cloudlabsettings:/app/cloudlabsettings
      - ../cloudlab/vault:/vault:ro

  test:
    build:
      dockerfile: Dockerfile.test
    platform: linux/amd64
    environment:
      LOCAL_MODE: "true"
      E2E_USERNAME: ${E2E_USERNAME:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["python", "-m", "pytest"]
    command: ["tests/", "-v", "--tb=short", "-m", "not e2e and not playwright"]
    profiles: ["test"]
